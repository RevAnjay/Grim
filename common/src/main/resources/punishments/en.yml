# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)
#
# Threshold:Interval Command
#
# Example, to kick the player with the message "incorrect movement!" after 100 violations, with no interval
# commands:
# - "100:0 kick %player% incorrect movement!"
# 0 means execute exactly once
# - "100:50 say %player% is cheating"
# Execute when the user hits flag 100, and after that, every 50th flag after 100
#
Punishments:
  ProtocolBan:
    remove-violations-after: 300
    checks:
      - "BadPacketsD"
      - "BadPacketsS"
      - "BadPacketsY"
      - "SelfInteract"
      - "BehaviorA"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:0 [webhook]"
      - "1:0 [proxy]"
      - "1:0 ban %player% [GroundedGrim] Protocol violation (%check_name%)"
  CrashBan:
    remove-violations-after: 300
    checks:
      - "CrashA"
      - "CrashC"
      - "CrashI"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:0 [webhook]"
      - "1:0 [proxy]"
      - "5:0 ban %player% [GroundedGrim] Crash exploit (%check_name%)"
  ExploitBan:
    remove-violations-after: 300
    checks:
      - "ExploitA"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:0 [webhook]"
      - "10:0 ban %player% [GroundedGrim] Exploit (%check_name%)"
  ProtocolKick:
    remove-violations-after: 300
    checks:
      - "BadPacketsF"
      - "BadPacketsG"
      - "BadPacketsI"
      - "BadPacketsK"
      - "BadPacketsL"
      - "BadPacketsO"
      - "BadPacketsH"
      - "PacketOrderB"
      - "PacketOrderC"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "10:0 [webhook]"
      - "10:0 [proxy]"
      - "20:0 kick %player% [GroundedGrim] Protocol violation (%check_name%)"
  CrashKick:
    remove-violations-after: 300
    checks:
      - "CrashB"
      - "CrashD"
      - "CrashF"
      - "CrashG"
      - "CrashH"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:0 [webhook]"
      - "3:0 [proxy]"
      - "10:0 kick %player% [GroundedGrim] Crash exploit (%check_name%)"
  Timer:
    remove-violations-after: 300
    checks:
      - "Timer"
      - "TimerLimit"
      - "TickTimer"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:0 [webhook]"
      - "40:0 [proxy]"
  CombatKick:
    remove-violations-after: 300
    checks:
      - "Reach"
      - "Hitboxes"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:0 [webhook]"
      - "5:0 [proxy]"
      - "40:0 kick %player% [GroundedGrim] Combat violation (%check_name%)"
  NoRotKick:
    remove-violations-after: 300
    checks:
      - "BehaviorD"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:0 [webhook]"
      - "3:0 kick %player% [GroundedGrim] Combat violation (%check_name%)"
  TriggerKick:
    remove-violations-after: 300
    checks:
      - "BehaviorE"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:0 [webhook]"
      - "2:0 kick %player% [GroundedGrim] Combat violation (%check_name%)"
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "NoFall"
    commands:
      - "100:40 [alert]"
      - "100:40 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "5:5 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      # exclude checks handled by ProtocolBan and ProtocolKick
      - "!BadPacketsD"
      - "!BadPacketsF"
      - "!BadPacketsG"
      - "!BadPacketsH"
      - "!BadPacketsI"
      - "!BadPacketsK"
      - "!BadPacketsL"
      - "!BadPacketsO"
      - "!BadPacketsS"
      - "!BadPacketsY"
      - "PacketOrder"
      - "!PacketOrderB"
      - "!PacketOrderC"
      - "CrashE"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "ExploitB"
    commands:
      - "10:5 [alert]"
      - "10:5 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  AutoclickerKick:
    remove-violations-after: 300
    checks:
      - "BehaviorB"
      - "BehaviorC"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:0 [webhook]"
      - "20:0 kick %player% [GroundedGrim] Combat violation (%check_name%)"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "20:40 [log]"
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "20:40 [log]"
