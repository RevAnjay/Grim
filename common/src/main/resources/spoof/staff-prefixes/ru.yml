# Префиксы для фейковых записей персонала. В каждой строке должно быть слово ранга, которое ищут читы -
# admin, moder, helper, staff, curator, support, стажер, сотрудник, помощник и подобные, - иначе их
# стафф-листы запись пропустят. Цвета - MiniMessage или &-коды, разбираются только при parse-colors.
spoof-staff-prefixes:
    - "Admin "
    - "Админ "
    - "Moder "
    - "Модератор "
    - "Helper "
    - "Хелпер "
    - "Curator "
    - "Куратор "
    - "Staff "
    - "Сотрудник "
    - "Помощник "
    - "Стажер "
    - "Стажёр "
    - "Support "
