# Убирает из пакетов то, что видно только читу. Всё выключено по умолчанию.
spoof:
    # Скрывать здоровье других игроков.
    entity-health: false
    # Что показывать вместо настоящего.
    health-value: 20.0
    # Насколько ниже оно может оказаться у конкретного игрока.
    health-spread: 6.0
    # Убавлять показанное здоровье от ударов, а вместо нуля восстанавливать.
    health-fake-damage: false
    # Скрывать и максимальное здоровье.
    max-health: false
    # Подменять то же значение в скорборде, который считает здоровье. Изменится и то, что под ником.
    health-scoreboard: false
    # Имена objective, значения которых тоже прятать как здоровье.
    health-scoreboard-objectives: []
    # Прятать и незнакомые objective, пока не станет ясно, что они не про здоровье.
    health-scoreboard-strict: false
    # Скрывать пинг других игроков.
    entity-ping: false
    # Что показывать вместо настоящего.
    ping-value: 100
    # Насколько ниже он может оказаться у конкретного игрока.
    ping-spread: 60
    # Округлять настоящий пинг до делений полоски в табе, если подмена выключена.
    ping-round: false
    # Скрывать поглощение (золотые сердца).
    absorption: false
    # Скрывать здоровье мобов. Волки, големы и визеры не затрагиваются, у них оно видно на модели.
    mob-health: false
    # Скрывать скорость, урон и броню других игроков.
    other-attributes: false

    # Скрывать, какие зелья на других игроках.
    potion-effects: false
    # Оставлять частицы зелий. Без них невидимые игроки не видны вообще ничем.
    keep-particles: true
    # Цвет частиц, десятичный RGB.
    particle-color: 3694534

    # Парсить цвета в подставляемых именах.
    parse-colors: false
    # Подменять скрытые имена строкой из spoof/item-names.yml вместо удаления.
    replace-item-names: false
    # Скрывать имена и лор у предметов на земле.
    ground-item-names: false
    # Давать имя из spoof/item-names.yml и предметам без своего имени.
    name-plain-items: false
    # Скрывать имена и лор у брони и предметов в руках.
    equipment-names: false
    # Давать имя броне и предметам в руках, если своего у них нет.
    name-plain-equipment: false
    # Скрывать зачарования, подменяя их одним - свечение остаётся.
    strip-enchantments: false
    # Скрывать тип зелья. Бутылки станут бесцветными.
    potion-items: false
    # Скрывать износ. Элитра в руке всегда выглядит целой.
    equipment-durability: false
    # Скрывать размер стака.
    equipment-count: false
    # Подменять название ядра, которое клиент видит в F3.
    server-brand: false
    # На что подменять.
    server-brand-value: vanilla
    # Скрывать модификаторы атрибутов предметов, которые выставил плагин.
    item-attributes: false

    # Скрывать кастомные имена мобов, у которых бирка над головой отключена.
    hidden-mob-names: false
    # Подменять их строкой из spoof/mob-names.yml вместо удаления.
    replace-mob-names: false
    # Давать имя мобам без имени. Стоит одного пакета на моба на зрителя.
    name-plain-mobs: false

    # Показывать всем чужим игрокам один режим игры вместо настоящего.
    entity-gamemode: false
    # Какой именно: survival, creative, adventure, spectator.
    gamemode-value: survival
    # Показывать наблюдателей как выживание в табе.
    spectator-gamemode: false
    # Убирать из команд скорборда игроков, которых зритель не видит.
    vanished-team-entries: false

    # Добавлять фейковый персонал. Ники и префиксы - в папке spoof.
    fake-staff: false
    # Сколько их одновременно: случайное число в этих границах.
    fake-staff-count:
        min: 3
        max: 6
    # Период смены набора в секундах.
    fake-staff-refresh: 300
    # Придумывать ники вместо spoof/staff-names.yml.
    fake-staff-random-names: true
